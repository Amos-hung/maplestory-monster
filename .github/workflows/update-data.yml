name: Update Monster Data

on:
  schedule:
    - cron: '0 16 * * *'   # 每天 UTC 16:00 執行，等於台灣時間凌晨 0:00
  workflow_dispatch:        # 允許你在 GitHub 網頁上手動點按執行

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch latest data
        run: |
          curl -sL "https://script.google.com/macros/s/AKfycbwEWiqm6bjN_vkf0yR4f_h0MG1tY8V7JWjJQ34MaGGyzE1VaXpTKxI2tlfmzp9yxRbl/exec" -o data.json
          
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update monster data (auto)"
          git push
