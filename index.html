<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>楓之谷全能圖鑑系統</title>
    <style>
      body { font-family: '微軟正黑體', sans-serif; background-color: #181818; color: #e8eaed; margin: 0; padding: 20px; text-align: center; }
      
      /* 將最大寬度放寬，以容納並排的網格卡片 */
      .container { max-width: 1200px; margin: 0 auto; background: #242424; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative; }
      h2 { color: #8ab4f8; } 
      
      .search-row { display: flex; gap: 10px; align-items: center; width: 100%; margin: 0 auto 15px auto; flex-wrap: wrap; justify-content: center; }
      .search-box { flex: 1; min-width: 200px; position: relative; text-align: left; }
      
      input[type="text"], input[type="number"], select { 
        padding: 12px; font-size: 16px; background-color: #303134; color: #e8eaed; 
        border: 2px solid #5f6368; border-radius: 8px; box-sizing: border-box; outline: none; transition: 0.3s; 
      }
      input[type="text"] { width: 100%; }
      input[type="number"] { width: 80px; text-align: center; }
      select { cursor: pointer; }
      
      input[type="text"]:focus, input[type="number"]:focus, select:focus { border-color: #8ab4f8; }
      input[type="text"]:disabled, input[type="number"]:disabled, select:disabled { background-color: #2a2a2a; color: #777; cursor: not-allowed; }
      
      button { padding: 12px 24px; font-size: 16px; background-color: #8ab4f8; color: #202124; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s;}
      button:hover { background-color: #aecbfa; }
      button:disabled { background-color: #555; color: #888; cursor: not-allowed; }
      
      .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #303134; border: 1px solid #5f6368; border-radius: 0 0 8px 8px; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: none; max-height: 250px; overflow-y: auto; list-style-type: none; padding: 0; margin: 0; }
      .suggestions li { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #444; color: #e8eaed; font-weight: bold; }
      .suggestions li:hover { background-color: #3c4043; color: #8ab4f8; }

      /* --- 全新網格與卡片樣式 --- */
      .result-list { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
        gap: 20px; 
        margin-top: 30px; 
        text-align: left;
      }
      
      .monster-card { 
        background: #303134; 
        border: 1px solid #444; 
        border-radius: 8px; 
        padding: 15px; 
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      
      .monster-img {
        height: 60px;
        max-width: 100%;
        object-fit: contain;
        background-color: transparent; 
        margin-bottom: 10px;
      }
      
      .monster-name {
        color: #fbbc04; 
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 5px;
      }
      
      .monster-level {
        color: #b0bec5;
        font-size: 13px;
        margin-bottom: 15px;
      }
      
      .drop-container {
        width: 100%;
        border: 1px solid #5f6368; 
        border-radius: 6px;
        padding: 10px;
        background: #28292c;
        box-sizing: border-box;
        flex-grow: 1; 
      }
      
      .drop-item {
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px dashed #444;
      }
      
      .drop-item:last-child {
        margin-bottom: 0;
        padding-bottom: 0;
        border-bottom: none;
      }
      
      .drop-name {
        color: #e8eaed;
        font-size: 14px;
        font-weight: bold;
      }
      
      .drop-req {
        display: inline-block;
        background: #444;
        color: #bbb;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        margin-left: 6px;
        vertical-align: middle;
      }
      
      .drop-desc {
        color: #9aa0a6;
        font-size: 12px;
        margin-top: 4px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
      
      #globalLoading { color: #f28b82; font-weight: bold; margin-bottom: 15px; }
      
      /* 修改筆數統計樣式，使其在網格中置頂橫跨所有欄位 */
      .result-count { 
        grid-column: 1 / -1; 
        color: #b0bec5; 
        font-size: 14px; 
        margin-bottom: -10px; 
        text-align: right; 
        border-bottom: 1px solid #444;
        padding-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>🔍 全能圖鑑搜尋 (GitHub 獨立網格版)</h2>
      
      <div id="globalLoading">🔄 正在連線至試算表載入圖鑑，請稍候...</div>
      
      <div class="search-row">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="資料載入中..." onkeyup="handleTyping()" autocomplete="off" disabled>
          <ul id="suggestionBox" class="suggestions"></ul>
        </div>
        
        <select id="levelType" disabled>
          <option value="monster">過濾怪物等級</option>
          <option value="item">過濾裝備限制</option>
        </select>
        
        <input type="number" id="minLevel" placeholder="Min" min="1" disabled>
        <span style="font-weight: bold;">-</span>
        <input type="number" id="maxLevel" placeholder="Max" min="1" disabled>

        <select id="sortType" disabled>
          <option value="default">預設排列</option>
          <option value="monster_asc">怪物等級：低 → 高</option>
          <option value="monster_desc">怪物等級：高 → 低</option>
          <option value="item_asc">裝備限制：低 → 高</option>
          <option value="item_desc">裝備限制：高 → 低</option>
        </select>
      </div>

      <button id="searchBtn" onclick="executeSearch()" disabled>一鍵搜查</button>
      
      <div id="results" class="result-list"></div>
    </div>

    <script>
      var localDatabase = []; 
      var timer;

      var API_URL = "https://script.google.com/macros/s/AKfycbxgCiepnE53iqDgWgs8KUra5CSuEFwnTZ9peGDVlX7AoQ2ftQczxCG8War2lyfcq7F0/exec";

      window.onload = function() {
        fetch(API_URL)
          .then(response => response.json())
          .then(data => {
            localDatabase = data; 
            
            document.getElementById('globalLoading').style.display = 'none';
            document.getElementById('searchInput').disabled = false;
            document.getElementById('searchInput').placeholder = "輸入怪物、道具名稱...";
            document.getElementById('levelType').disabled = false;
            document.getElementById('minLevel').disabled = false;
            document.getElementById('maxLevel').disabled = false;
            document.getElementById('sortType').disabled = false;
            document.getElementById('searchBtn').disabled = false;
          })
          .catch(err => {
            document.getElementById('globalLoading').innerText = "❌ 資料載入失敗，請確認後端部署設定是否正確。";
            console.error(err);
          });
      };

      function handleTyping() {
        var keyword = document.getElementById('searchInput').value;
        var box = document.getElementById('suggestionBox');
        if (keyword.length < 1) { box.style.display = 'none'; return; }
        
        clearTimeout(timer);
        timer = setTimeout(function() {
          var cleanKeyword = keyword.replace(/\s+/g, '').toLowerCase();
          var suggestions = [];
          var uniqueCheck = {};
          
          for (var i = 0; i < localDatabase.length; i++) {
            var mName = localDatabase[i].monster;
            var iName = localDatabase[i].item;
            
            if (mName && mName.toLowerCase().indexOf(cleanKeyword) !== -1 && !uniqueCheck[mName]) {
              uniqueCheck[mName] = true; suggestions.push(mName);
            }
            if (iName && iName.toLowerCase().indexOf(cleanKeyword) !== -1 && !uniqueCheck[iName]) {
              uniqueCheck[iName] = true; suggestions.push(iName);
            }
            if (suggestions.length >= 10) break;
          }
          showSuggestions(suggestions);
        }, 150);
      }

      function showSuggestions(list) {
        var box = document.getElementById('suggestionBox');
        box.innerHTML = '';
        if (list.length === 0) { box.style.display = 'none'; return; }
        
        for (var i = 0; i < list.length; i++) {
          var li = document.createElement('li');
          li.innerText = list[i];
          li.onclick = function() {
            document.getElementById('searchInput').value = this.innerText;
            box.style.display = 'none';
            executeSearch();
          };
          box.appendChild(li);
        }
        box.style.display = 'block';
      }

      document.addEventListener('click', function(e) {
        if(e.target.id !== 'searchInput') {
          document.getElementById('suggestionBox').style.display = 'none';
        }
      });

      function executeSearch() {
        var keyword = document.getElementById('searchInput').value;
        var minStr = document.getElementById('minLevel').value;
        var maxStr = document.getElementById('maxLevel').value;
        var levelType = document.getElementById('levelType').value;
        var sortType = document.getElementById('sortType').value;

        if (!keyword && !minStr && !maxStr) return;
        
        document.getElementById('suggestionBox').style.display = 'none';
        var container = document.getElementById('results');
        container.innerHTML = '<div style="color: #8ab4f8; font-weight: bold; text-align: center; grid-column: 1 / -1;">資料分析整理中...</div>';
        
        setTimeout(function() {
          var cleanKeyword = keyword.replace(/\s+/g, '').toLowerCase();
          var minLv = minStr === "" ? 0 : parseInt(minStr);
          var maxLv = maxStr === "" ? 9999 : parseInt(maxStr);

          var resultData = [];

          for (var i = 0; i < localDatabase.length; i++) {
            var d = localDatabase[i];
            
            var targetLevel = 0;
            if (levelType === 'monster') {
              targetLevel = parseInt(d.level) || 0;
            } else {
              var match = String(d.reqLevel).match(/\d+/);
              targetLevel = match ? parseInt(match[0]) : 0;
            }

            var levelMatch = false;
            if (levelType === 'item' && targetLevel === 0 && minLv > 0) {
               levelMatch = false;
            } else {
               levelMatch = (targetLevel >= minLv && targetLevel <= maxLv);
            }
            
            var keywordMatch = true;
            if (cleanKeyword !== "") {
              keywordMatch = (d.searchStr.indexOf(cleanKeyword) !== -1);
            }

            if (levelMatch && keywordMatch) {
              resultData.push(d);
            }
          }
          
          if (sortType !== 'default') {
            resultData.sort(function(a, b) {
              var aMonLv = parseInt(a.level) || 0;
              var bMonLv = parseInt(b.level) || 0;
              
              var aMatch = String(a.reqLevel).match(/\d+/);
              var bMatch = String(b.reqLevel).match(/\d+/);
              var aItemLv = aMatch ? parseInt(aMatch[0]) : 0;
              var bItemLv = bMatch ? parseInt(bMatch[0]) : 0;

              if (sortType === 'monster_asc') return aMonLv - bMonLv;
              if (sortType === 'monster_desc') return bMonLv - aMonLv;
              if (sortType === 'item_asc') return aItemLv - bItemLv;
              if (sortType === 'item_desc') return bItemLv - aItemLv;
              return 0;
            });
          }
          
          renderResults(resultData);
        }, 50);
      }

      function renderResults(data) {
        var container = document.getElementById('results');
        container.innerHTML = ''; 
        
        if(data.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#f28b82; grid-column: 1 / -1; font-weight: bold;">資料庫中找不到符合的結果 😢</p>';
          return;
        }

        var countHeader = document.createElement('div');
        countHeader.className = 'result-count';
        countHeader.innerText = '✅ 共找到 ' + data.length + ' 筆掉落物結果';
        container.appendChild(countHeader);

        // 核心改動：將排序後的結果依照「怪物」進行打包分組
        var groupedData = {};
        var order = []; // 用來紀錄怪物出現的順序，以維持排序效果
        
        for(var i = 0; i < data.length; i++) {
          var d = data[i];
          var mKey = d.monster; 
          
          if(!groupedData[mKey]) {
            groupedData[mKey] = {
              name: d.monster,
              level: d.level,
              image: d.image,
              drops: []
            };
            order.push(mKey);
          }
          groupedData[mKey].drops.push(d);
        }

        var finalHtml = '';
        for(var k = 0; k < order.length; k++) {
          var mKey = order[k];
          var mData = groupedData[mKey];
          
          var htmlStr = '<div class="monster-card">';
          
          // --- 怪物標頭區塊 ---
          if (mData.image) { 
            htmlStr += '<img class="monster-img" src="' + mData.image + '" onerror="this.style.display=\'none\'">'; 
          }
          htmlStr += '<div class="monster-name">' + mData.name + '</div>';
          htmlStr += '<div class="monster-level">等級: ' + mData.level + '</div>';
          
          // --- 掉落物清單區塊 ---
          htmlStr += '<div class="drop-container">';
          for(var j = 0; j < mData.drops.length; j++) {
            var drop = mData.drops[j];
            htmlStr += '<div class="drop-item">';
            
            // 道具名稱與條件標籤
            htmlStr += '<div><span class="drop-name">' + drop.item + '</span>';
            if (drop.reqLevel && drop.reqLevel !== "") {
              htmlStr += '<span class="drop-req">' + drop.reqLevel + '</span>';
            }
            htmlStr += '</div>';
            
            // 道具說明
            if (drop.desc) {
              htmlStr += '<div class="drop-desc">' + drop.desc + '</div>';
            }
            
            htmlStr += '</div>'; // end drop-item
          }
          htmlStr += '</div>'; // end drop-container
          
          htmlStr += '</div>'; // end monster-card
          finalHtml += htmlStr;
        }
        
        container.insertAdjacentHTML('beforeend', finalHtml);
      }
    </script>
  </body>
</html>
